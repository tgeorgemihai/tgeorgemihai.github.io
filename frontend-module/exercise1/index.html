<!DOCTYPE html>
<html lang="en">

<head>
    <title>Cat Game by Geo</title>
    <link rel="icon" href="files/icon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>&#128570; Cat Game</h1>
    <p>Pet the cat to gain points</p>
    <p>Score is: <b id="score-value">0</b></p>

    <button id="button">Click me to see your score</button>

    <br>

    <div class="game">
        <div class="box"></div> <!-- div-top-left  -->
        <div class="box to-right"> </div> <!-- div-top-right -->
        <br>
        <div class="box"></div> <!-- div-bottom-left -->
        <div class="box to-right"> </div> <!-- div-bottom-right -->
    </div>

    <script src="script.js" defer></script>

</body>

</html>
